name: Feature request
description: Suggest a focused improvement to Fishcraft.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed functionality
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design suggestions or alternatives
      description: Optional.
